name: BTC 4小时正式复盘（GPT）

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-4h-review
  cancel-in-progress: false

jobs:
  review:
    name: GPT 4小时正式复盘
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_RUNS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BTC_SYMBOL: ${{ vars.BTC_SYMBOL }}
      BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL }}
      JEV_MODEL: ${{ vars.JEV_MODEL }}
      GPT_MODEL: ${{ vars.GPT_MODEL }}
      GPT_FALLBACK_MODEL_1: ${{ vars.GPT_FALLBACK_MODEL_1 }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装程序依赖
        run: npm install --no-audit --no-fund

      - name: 运行计划内 4小时正式复盘
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npm run four-hour

      - name: Telegram 推送 4小时复盘
        if: ${{ vars.ENABLE_TELEGRAM == 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run telegram

      - name: 把正式报告显示在任务摘要
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 保存本次正式复盘文件
        uses: actions/upload-artifact@v4
        with:
          name: btc-4h-${{ github.run_id }}
          path: out/
          retention-days: 30

      - name: 把正式复盘写入 reports 文件夹
        if: ${{ vars.SAVE_REPORTS_TO_REPO == 'true' }}
        run: |
          git config user.name "btc-jev-radar[bot]"
          git config user.email "btc-jev-radar[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "报告：BTC 4小时复盘 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
