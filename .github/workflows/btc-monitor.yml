name: BTC Radar Monitor

on:
  schedule:
    # Private-repo default: 30-minute polling keeps monthly runner usage near the GitHub Free allowance.
    # The underlying source still uses 5-minute candles.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-radar-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run Jev monitor
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npm run monitor
      - name: Add summary
        if: always()
        run: |
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload decision snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-radar-${{ github.run_id }}
          path: out/
          retention-days: 14
      - name: Commit L3 report if generated
        run: |
          if [ ! -f out/report.md ]; then exit 0; fi
          git config user.name "btc-jev-radar[bot]"
          git config user.email "btc-jev-radar[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: BTC L3 event $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
