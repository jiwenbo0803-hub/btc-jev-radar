name: BTC 行情雷达（Jev）

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: '发送 Telegram 测试消息'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: btc-radar-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Jev 雷达巡检
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装程序依赖
        run: npm install --no-audit --no-fund

      - name: Telegram连接测试
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🚨 BTC Jev Radar 测试消息\n\nTelegram 通道连接正常。"

      - name: 运行 Jev 行情巡检
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npm run monitor

      - name: GitHub 异动提醒
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run notify

      - name: Telegram 手机异动提醒
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run telegram

      - name: 把中文摘要写入任务页面
        if: always()
        run: |
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 保存本次判断结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-radar-${{ github.run_id }}
          path: out/
          retention-days: 14

      - name: 如果触发 L3，则保存深度分析报告
        run: |
          if [ ! -f out/report.md ]; then exit 0; fi
          git config user.name "btc-jev-radar[bot]"
          git config user.email "btc-jev-radar[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "报告：BTC L3 异常 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
